name: Phase A and focused CRUD-auth checks (not release gates)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-unit:
    name: Static, units and packed consumer / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.21.0']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - name: Cache pinned runtime metadata for offline consumers
        run: |
          npm cache add trailbase@0.14.3
          npm cache add @types/geojson@7946.0.16
          npm cache add @ungap/raw-json@0.4.4
          npm cache add geojson@0.5.0
          npm cache add jwt-decode@4.0.0
          npm cache add uuid@14.0.2
      - run: npm run build:sdk
      - run: npm run test:sdk:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase-a-unit-node-${{ matrix.node }}
          path: |
            artifacts/unit/*.json
            artifacts/sdk-package/*.json
          if-no-files-found: error
          retention-days: 14

  sdk-mvp:
    name: Focused SDK CRUD-auth / real fixtures / packed browsers
    needs: static-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Cache pinned runtime metadata for offline browser consumers
        run: |
          npm cache add trailbase@0.14.3
          npm cache add @types/geojson@7946.0.16
          npm cache add @ungap/raw-json@0.4.4
          npm cache add geojson@0.5.0
          npm cache add jwt-decode@4.0.0
          npm cache add uuid@14.0.2
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:sdk:auth
      - run: npm run test:sdk:refresh
        if: always()
      - run: npm run test:sdk:data
        if: always()
      - run: npm run test:db
        if: always()
      - run: npm run test:phase-a -- constraints
        if: always()
      - run: npm run test:sdk:browser
        if: always()
      - run: npm run test:example:todos
        if: always()
      - run: npm run test:cleanup
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sdk-crud-auth-sanitized
          path: |
            artifacts/phase-a/*.json
            artifacts/todos/*.json
          if-no-files-found: error
          retention-days: 14

  real-backends:
    name: Real backends / browser infrastructure / cleanup
    needs: static-unit
    runs-on: ubuntu-24.04
    # Three browser engines add 100 CDC-ready channel cycles each; still bounded.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:phase-a
      - name: Explicit short-lived native auth fixture / real expiry
        if: always()
        run: npm run test:phase-a -- expiry
      - name: Investigational candidate signup / strict characterization
        if: always()
        run: npm run test:phase-a -- characterization --auth-mitigation
      - name: Investigational candidate / strict SMTP recovery
        if: always()
        run: npm run test:phase-a -- smtp --auth-mitigation
      - name: LEGACY0.34.3 owned-depot auth migration preflight rollback
        if: always()
        run: npm run test:phase-a -- auth-migration
      - name: Official current native upgrade / backup restore / rollback safety
        if: always()
        run: npm run test:native:upgrade
      - name: Three-browser isolated proof / infrastructure controls
        if: always()
        run: npm run test:phase-a -- browser
      - run: npm run test:cleanup
        if: always()
      # Whitelisted summaries only. Raw .runtime reports/logs/mail contain secrets and MUST NOT be uploaded.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase-a-real-backends-sanitized
          path: |
            artifacts/phase-a/*.json
            artifacts/native-upgrade/*.json
          if-no-files-found: error
          retention-days: 14
