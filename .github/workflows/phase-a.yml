name: Phase A proof harness (not SDK release gates)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-unit:
    name: Harness checks / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.21.0']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase-a-unit-node-${{ matrix.node }}
          path: artifacts/unit/*.json
          if-no-files-found: error
          retention-days: 14

  real-backends:
    name: Real backends / browser infrastructure / cleanup
    needs: static-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:phase-a
      - name: Explicit short-lived native auth fixture / real expiry
        if: always()
        run: npm run test:phase-a -- expiry
      - run: npm run test:cleanup
        if: always()
      # Whitelisted summaries only. Raw .runtime reports/logs/mail contain secrets and MUST NOT be uploaded.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase-a-real-backends-sanitized
          path: artifacts/phase-a/*.json
          if-no-files-found: error
          retention-days: 14
